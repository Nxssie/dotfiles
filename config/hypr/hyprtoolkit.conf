# Theme for hyprtoolkit-based apps (hyprshutdown, hyprpicker, etc.)
# Tokyo Night palette, matching ~/.config/quickshell/Theme.qml

# Colors (0xAARRGGBB) — extra contrast between layers for depth
background = 0xFF1a1b26
base = 0xFF24283b
text = 0xFFa9b1d6
alternate_base = 0xFF283457
bright_text = 0xFFc0caf5
link_text = 0xFF7dcfff
accent = 0xFF7aa2f7
accent_secondary = 0xFFbb9af7

# Rounded corners so it does not look flat
rounding_large = 14
rounding_small = 8

# Typography
h1_size = 19
h2_size = 15
h3_size = 13
font_size = 12
small_font_size = 10
font_family = monospace
font_family_monospace = monospace
