# Idle chain (seconds): 150 dim -> 300 lock -> 330 screen off -> 900 suspend.
# The bar's IdleInhibitor (caffeine, playing media, fullscreen window) pauses
# the whole chain; hyprlock is locked-aware so the lock itself never reruns.
general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/lock.sh
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the panel and kill the keyboard backlight as a warning before the lock;
# -s saves the level and -r restores it exactly on any input.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10% && brightnessctl -s -d 'asus::kbd_backlight' set 0
    on-resume = brightnessctl -r && brightnessctl -r -d 'asus::kbd_backlight'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off shortly after locking: no point lighting the lock screen for
# ten minutes until suspend. dpms on restores it on the first key/mouse.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
