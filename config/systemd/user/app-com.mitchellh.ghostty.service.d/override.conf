[Service]
# Ghostty's unit is Type=notify-reload (ReloadSignal=SIGUSR2). It reports READY
# slightly before installing its SIGUSR2 handler, and systemd 262 refuses to start
# a notify-reload service whose main process lacks the handler at that moment:
#   "Main process lacks handler for reload signal USR2, refusing service startup"
#   -> "Failed with result 'protocol'" -> D-Bus activation fails ("startup job failed")
# Roughly every other cold start fails this way. Plain notify keeps the readiness
# tracking without the handler check; Ghostty reloads its own config, so nothing
# relies on `systemctl reload`.
Type=notify
