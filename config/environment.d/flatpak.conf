# Expose Flatpak .desktop entries / icons to the systemd --user session.
# /etc/profile.d/flatpak.sh only patches login shells; services started by
# systemd --user (quickshell's launcher reads DesktopEntries via XDG_DATA_DIRS)
# never see it, so Flatpak apps were missing from the SUPER+SPACE launcher.
XDG_DATA_DIRS=${XDG_DATA_HOME:-${HOME}/.local/share}/flatpak/exports/share:/var/lib/flatpak/exports/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
